<!--
  作者：李汶静
  创建时间：2026-11-23 14:40
  使用模型：DeepSeek-V4.1-Flash
  功能：调用本地后端 /api/chat 的多轮对话页面，输入框 + 发送按钮 + 消息区，等待时显示“正在思考…”。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天 · 后端接口版</title>
  <link rel="stylesheet" href="cdn/fonts/fonts.css">
  <style>
    :root {
      --lwj_bg: #0a0c12;
      --lwj_panel: #141822;
      --lwj_line: rgba(255, 255, 255, 0.1);
      --lwj_text: #e9ecf6;
      --lwj_muted: #8b93a8;
      --lwj_accent: #5b8cff;
      --lwj_mint: #4fd8c0;
      --lwj_red: #ff6b5e;
      --lwj_mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(800px 460px at 50% -10%, rgba(91, 140, 255, 0.18), transparent 70%),
        var(--lwj_bg);
      color: var(--lwj_text);
      line-height: 1.72;
      overflow: hidden;
    }

    .lwj_app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    /* 顶栏 */
    .lwj_top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--lwj_line);
    }
    .lwj_back {
      font-size: 12px;
      color: var(--lwj_muted);
      text-decoration: none;
      border: 1px solid var(--lwj_line);
      border-radius: 999px;
      padding: 5px 11px;
      transition: color 0.2s, border-color 0.2s;
    }
    .lwj_back:hover { color: var(--lwj_accent); border-color: rgba(91, 140, 255, 0.5); }
    .lwj_title { font-size: 14.5px; font-weight: 600; letter-spacing: 0.03em; }
    .lwj_title small {
      display: block;
      font-size: 10.5px;
      font-weight: 400;
      color: var(--lwj_muted);
      font-family: var(--lwj_mono);
      letter-spacing: 0.02em;
    }
    .lwj_clear {
      margin-left: auto;
      font-family: inherit;
      font-size: 12px;
      color: var(--lwj_text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--lwj_line);
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      touch-action: manipulation;
    }
    .lwj_clear:hover { border-color: rgba(91, 140, 255, 0.55); color: #c9d6ff; }

    /* 消息区 */
    .lwj_msgs {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .lwj_msgs::-webkit-scrollbar { width: 8px; }
    .lwj_msgs::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 999px; }

    .lwj_empty {
      margin: auto;
      text-align: center;
      color: var(--lwj_muted);
      font-size: 13px;
    }
    .lwj_empty strong { display: block; font-size: 17px; color: var(--lwj_text); margin-bottom: 6px; }
    .lwj_empty code {
      font-family: var(--lwj_mono);
      font-size: 11.5px;
      color: #b9c8ff;
    }

    .lwj_msg {
      display: flex;
      gap: 9px;
      animation: lwj_in 0.28s ease both;
    }
    .lwj_msg--user { flex-direction: row-reverse; }

    .lwj_avatar {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-family: var(--lwj_mono);
      margin-top: 3px;
    }
    .lwj_msg--user .lwj_avatar {
      background: rgba(91, 140, 255, 0.2);
      border: 1px solid rgba(91, 140, 255, 0.42);
      color: #c9d6ff;
    }
    .lwj_msg--bot .lwj_avatar {
      background: rgba(79, 216, 192, 0.16);
      border: 1px solid rgba(79, 216, 192, 0.4);
      color: var(--lwj_mint);
    }

    .lwj_bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.78;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .lwj_msg--user .lwj_bubble {
      background: linear-gradient(135deg, rgba(91, 140, 255, 0.26), rgba(91, 140, 255, 0.14));
      border: 1px solid rgba(91, 140, 255, 0.34);
      border-top-right-radius: 4px;
    }
    .lwj_msg--bot .lwj_bubble {
      background: var(--lwj_panel);
      border: 1px solid var(--lwj_line);
      border-top-left-radius: 4px;
    }
    .lwj_msg--error .lwj_bubble {
      background: rgba(255, 107, 94, 0.1);
      border-color: rgba(255, 107, 94, 0.42);
      color: #ffc9c4;
    }

    /* 正在思考… */
    .lwj_thinking {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--lwj_muted);
      font-size: 13px;
    }
    .lwj_thinking i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--lwj_mint);
      animation: lwj_bounce 1.1s infinite ease-in-out;
    }
    .lwj_thinking i:nth-child(2) { animation-delay: 0.15s; }
    .lwj_thinking i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes lwj_bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes lwj_in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 输入区 */
    .lwj_composer {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 12px 18px 16px;
      border-top: 1px solid var(--lwj_line);
    }
    .lwj_input {
      flex: 1 1 auto;
      resize: none;
      border: 1px solid var(--lwj_line);
      border-radius: 12px;
      background: var(--lwj_panel);
      color: var(--lwj_text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.7;
      padding: 10px 13px;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }
    .lwj_input:focus { border-color: rgba(91, 140, 255, 0.55); }
    .lwj_input::placeholder { color: #5b6478; }

    .lwj_send {
      flex: 0 0 auto;
      min-width: 76px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--lwj_accent), var(--lwj_mint));
      color: #08101c;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      touch-action: manipulation;
    }
    .lwj_send:hover { transform: translateY(-1px); }
    .lwj_send:active { transform: scale(0.97); }
    .lwj_send[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; }

    .lwj_hint {
      padding: 0 18px 10px;
      font-size: 10.5px;
      color: #5b6478;
      font-family: var(--lwj_mono);
    }

    @media (max-width: 560px) {
      .lwj_msgs { padding: 16px 14px 6px; }
      .lwj_composer { padding: 10px 14px 14px; }
      .lwj_bubble { max-width: 88%; font-size: 13.5px; }
      .lwj_send { min-width: 62px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body>
  <div class="lwj_app">
    <header class="lwj_top">
      <a class="lwj_back" href="index.html">← 返回首页</a>
      <div class="lwj_title">
        AI 聊天 · 后端接口版
        <small>POST /api/chat · 多轮对话</small>
      </div>
      <button class="lwj_clear" type="button" id="lwj_clear">清空对话</button>
    </header>

    <main class="lwj_msgs" id="lwj_msgs">
      <div class="lwj_empty" id="lwj_empty">
        <strong>你好，我是 AI 助手</strong>
        消息会通过本地后端 <code>/api/chat</code> 转发给模型<br>
        先问「你好」，再问「我刚才问了什么」试试多轮记忆
      </div>
    </main>

    <div class="lwj_composer">
      <textarea class="lwj_input" id="lwj_input" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
      <button class="lwj_send" type="button" id="lwj_send">发送</button>
    </div>
    <div class="lwj_hint" id="lwj_hint">当前对话条数：0 · 等待输入</div>
  </div>

  <script>
    /**
     * 后端接口版聊天页面
     * @desc 维护 messages 上下文数组，调用本地 /api/chat 获取回答，实现多轮对话与“正在思考…”状态
     * @author 李汶静
     * @created 2026-11-23
     */
    (function () {
      'use strict';

      var LWJ_API = '/api/chat';
      var LWJ_SYSTEM = '你是一个简洁、友好的中文助手，回答控制在三句话以内。';

      var lwj_msgsEl = document.getElementById('lwj_msgs');
      var lwj_empty = document.getElementById('lwj_empty');
      var lwj_input = document.getElementById('lwj_input');
      var lwj_send = document.getElementById('lwj_send');
      var lwj_clear = document.getElementById('lwj_clear');
      var lwj_hint = document.getElementById('lwj_hint');

      // 多轮对话的核心：每轮都把用户消息与 AI 回复 push 进来，下次请求整段发过去
      var lwj_messages = [{ role: 'system', content: LWJ_SYSTEM }];
      var lwj_pending = false;

      /**
       * 创建一条消息气泡
       * @desc 区分用户与 AI，返回气泡内容节点，便于后续替换“正在思考…”占位
       * @param {string} lwj_role - user / bot / error
       * @param {string} lwj_text - 消息文本
       * @returns {HTMLElement} 气泡节点
       */
      function lwj_addBubble(lwj_role, lwj_text) {
        if (lwj_empty && lwj_empty.parentNode) { lwj_empty.remove(); }

        var row = document.createElement('div');
        row.className = 'lwj_msg ' + (lwj_role === 'user' ? 'lwj_msg--user' : 'lwj_msg--bot') +
                        (lwj_role === 'error' ? ' lwj_msg--error' : '');

        var avatar = document.createElement('div');
        avatar.className = 'lwj_avatar';
        avatar.textContent = lwj_role === 'user' ? '我' : 'AI';

        var bubble = document.createElement('div');
        bubble.className = 'lwj_bubble';
        bubble.textContent = lwj_text;

        row.appendChild(avatar);
        row.appendChild(bubble);
        lwj_msgsEl.appendChild(row);
        lwj_msgsEl.scrollTop = lwj_msgsEl.scrollHeight;
        return bubble;
      }

      /**
       * 生成“正在思考…”占位内容
       * @desc 用三个跳动的点提示用户请求进行中
       * @param {HTMLElement} lwj_bubble - 目标气泡
       * @returns {void}
       */
      function lwj_showThinking(lwj_bubble) {
        lwj_bubble.innerHTML = '<span class="lwj_thinking">正在思考<i></i><i></i><i></i></span>';
      }

      /**
       * 更新底部提示
       * @desc 显示当前上下文条数与状态，便于观察多轮对话是否在累积
       * @param {string} lwj_status - 状态文案
       * @returns {void}
       */
      function lwj_updateHint(lwj_status) {
        var count = Math.max(0, lwj_messages.length - 1);
        lwj_hint.textContent = '当前对话条数：' + count + ' · ' + lwj_status;
      }

      /**
       * 切换发送按钮状态
       * @desc 请求期间禁用按钮，防止重复提交
       * @param {boolean} lwj_busy - 是否正在请求
       * @returns {void}
       */
      function lwj_setBusy(lwj_busy) {
        lwj_pending = lwj_busy;
        lwj_send.disabled = lwj_busy;
        lwj_send.textContent = lwj_busy ? '思考中' : '发送';
      }

      /**
       * 发送一条消息
       * @desc 先渲染用户气泡，再请求后端，成功则替换占位为回答并写入上下文
       * @returns {Promise<void>}
       */
      async function lwj_sendMessage() {
        if (lwj_pending) { return; }

        var text = lwj_input.value.trim();
        if (!text) { return; }

        lwj_input.value = '';
        lwj_input.style.height = 'auto';

        lwj_addBubble('user', text);
        lwj_messages.push({ role: 'user', content: text });

        var botBubble = lwj_addBubble('bot', '');
        lwj_showThinking(botBubble);
        lwj_setBusy(true);
        lwj_updateHint('AI 正在思考…');

        try {
          var res = await fetch(LWJ_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: lwj_messages })
          });

          var data = await res.json().catch(function () { return {}; });

          if (!res.ok) {
            throw new Error(data.error || ('接口返回 HTTP ' + res.status));
          }
          if (!data.reply) {
            throw new Error('接口没有返回 reply 字段');
          }

          botBubble.textContent = data.reply;
          lwj_messages.push({ role: 'assistant', content: data.reply });
          lwj_updateHint('收到回答');
        } catch (err) {
          botBubble.parentNode.classList.add('lwj_msg--error');
          botBubble.textContent = '请求失败：' + err.message;
          // 失败时把刚才的用户消息从上下文里撤回，避免污染下一轮
          lwj_messages.pop();
          lwj_updateHint('请求失败，请检查后端是否已启动');
        } finally {
          lwj_setBusy(false);
          lwj_msgsEl.scrollTop = lwj_msgsEl.scrollHeight;
          lwj_input.focus();
        }
      }

      /**
       * 输入框自适应高度
       * @desc 先归零再按内容撑开，最大高度由 CSS 限制
       * @returns {void}
       */
      function lwj_autosize() {
        lwj_input.style.height = 'auto';
        lwj_input.style.height = Math.min(lwj_input.scrollHeight, 120) + 'px';
      }

      /**
       * 清空对话
       * @desc 重置上下文数组与消息区，只保留 system 提示
       * @returns {void}
       */
      function lwj_clearChat() {
        lwj_messages = [{ role: 'system', content: LWJ_SYSTEM }];
        lwj_msgsEl.innerHTML = '';
        var empty = document.createElement('div');
        empty.className = 'lwj_empty';
        empty.id = 'lwj_empty';
        empty.innerHTML = '<strong>你好，我是 AI 助手</strong>消息会通过本地后端 <code>/api/chat</code> 转发给模型<br>先问「你好」，再问「我刚才问了什么」试试多轮记忆';
        lwj_msgsEl.appendChild(empty);
        lwj_empty = empty;
        lwj_updateHint('已清空');
      }

      lwj_send.addEventListener('click', lwj_sendMessage);
      lwj_clear.addEventListener('click', lwj_clearChat);

      lwj_input.addEventListener('input', lwj_autosize);
      lwj_input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          lwj_sendMessage();
        }
      });

      lwj_updateHint('等待输入');
      lwj_input.focus();
    })();
  </script>
</body>
</html>
