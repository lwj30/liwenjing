<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库连接 · 李汶静</title>
  <link rel="stylesheet" href="css/lwj_style.css">
</head>
<body>
  <canvas id="lwj_canvas" class="lwj_canvas" aria-hidden="true"></canvas>

  <div class="lwj_page">
    <header class="lwj_hero lwj_hero--compact">
      <div class="lwj_hero-glow"></div>
      <span class="lwj_badge">LWJ · MYSQL CONNECT</span>
      <h1 class="lwj_title">MySQL 数据库连接</h1>
      <p class="lwj_subtitle">输入用户名和密码，通过后端接口测试连接状态</p>
    </header>

    <main class="lwj_main">
      <section class="lwj_section">
        <div class="lwj_section-head">
          <div>
            <h2 class="lwj_section-title">连接参数</h2>
            <p class="lwj_section-desc">主机与库名由后端配置提供，页面只提交账号和密码。</p>
          </div>
          <a class="lwj_back" href="index.html">返回首页</a>
        </div>

        <form id="lwj_db_form" class="lwj_form" novalidate>
          <div class="lwj_form-row">
            <label class="lwj_label" for="lwj_db_user">用户名</label>
            <input class="lwj_input" id="lwj_db_user" name="lwj_user" type="text" autocomplete="off">
          </div>
          <div class="lwj_form-row">
            <label class="lwj_label" for="lwj_db_password">密码</label>
            <input class="lwj_input" id="lwj_db_password" name="lwj_password" type="password" autocomplete="off">
          </div>
          <div class="lwj_form-actions">
            <button class="lwj_button" id="lwj_db_submit" type="submit">连接数据库</button>
          </div>
        </form>

        <div id="lwj_db_info" class="lwj_info"></div>
        <div id="lwj_db_message" class="lwj_message" role="status" aria-live="polite"></div>
      </section>
    </main>

    <footer class="lwj_footer">
      <span>李汶静 · 24001011030</span>
      <span>原生前端 · Express 后端 · MySQL 数据库</span>
    </footer>
  </div>

  <script src="js/lwj_canvas.js"></script>
  <script src="js/lwj_mock.js"></script>
  <script src="js/lwj_config.js"></script>
  <script src="js/lwj_database.js"></script>
</body>
</html>
